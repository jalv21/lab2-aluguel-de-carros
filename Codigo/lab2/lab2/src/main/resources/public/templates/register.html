<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Aluguel de Carros</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --light-bg: #ecf0f1;
            --text-dark: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #7f8c8d;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        .hidden {
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-register {
            background-color: var(--success-color);
            color: white;
        }

        .btn-register:hover {
            background-color: #229954;
        }

        .btn-cancel {
            background-color: #95a5a6;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #7f8c8d;
        }

        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border-left: 4px solid;
        }

        .alert-danger {
            background-color: #f8d7da;
            border-color: var(--danger-color);
            color: #721c24;
        }

        .alert-success {
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        @media (max-width: 600px) {
            .register-container {
                padding: 30px 20px;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>Criar Conta</h1>
            <p>Cadastre-se no sistema</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/register}" method="POST">
            <div class="form-group">
                <label for="tipoUsuario">Tipo de Usuário *</label>
                <select id="tipoUsuario" name="tipoUsuario" required onchange="updateFields()">
                    <option value="">Selecione um tipo</option>
                    <option value="CLIENTE">Cliente</option>
                    <option value="BANCO">Banco</option>
                    <option value="EMPRESA">Empresa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nome">Nome Completo *</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="login">Usuário *</label>
                <input type="text" id="login" name="login" required placeholder="Digite um nome de usuário">
            </div>

            <div class="form-group">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" name="senha" required placeholder="Digite uma senha">
            </div>

            <div class="form-group">
                <label for="endereco">Endereço *</label>
                <input type="text" id="endereco" name="endereco" required placeholder="Digite seu endereço">
            </div>

            <!-- Campo para Cliente -->
            <div id="clienteFields" class="hidden">
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="rg">RG *</label>
                            <input type="text" id="rg" name="rg" placeholder="Digite seu RG">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="profissao">Profissão *</label>
                    <input type="text" id="profissao" name="profissao" placeholder="Digite sua profissão">
                </div>
            </div>

            <!-- Campos para Agente (Banco/Empresa) -->
            <div id="agenteFields" class="hidden">
                <div class="form-group">
                    <label for="cnpj">CNPJ *</label>
                    <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00">
                </div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-register">Cadastrar</button>
                <button type="button" class="btn btn-cancel" onclick="window.location.href='/login'">Cancelar</button>
            </div>
        </form>
    </div>

    <script>
        function updateFields() {
            const tipoUsuario = document.getElementById('tipoUsuario').value;
            const clienteFields = document.getElementById('clienteFields');
            const agenteFields = document.getElementById('agenteFields');

            clienteFields.classList.add('hidden');
            agenteFields.classList.add('hidden');

            if (tipoUsuario === 'CLIENTE') {
                clienteFields.classList.remove('hidden');
            } else if (tipoUsuario === 'BANCO' || tipoUsuario === 'EMPRESA') {
                agenteFields.classList.remove('hidden');
            }
        }

        // Atualizar campos ao carregar a página se houver tipo selecionado
        document.addEventListener('DOMContentLoaded', function() {
            updateFields();
        });
    </script>
</body>
</html>
