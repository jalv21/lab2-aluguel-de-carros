<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Aluguel - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Pedido de Aluguel</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8 max-w-2xl">
                    <div id="messagesContainer"></div>
                    <a href="/pedidos-aluguel" class="text-blue-600 hover:text-blue-800 text-sm mb-4 inline-block">
                        <i data-feather="arrow-left" class="w-4 h-4 inline mr-1"></i>
                        Voltar para Pedidos
                    </a>
                    <div class="bg-white rounded-lg shadow p-8">
                        <div class="mb-6">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h2 class="text-3xl font-bold text-gray-900">Pedido <span id="pedidoId">#</span></h2>
                                    <p class="text-gray-500 mt-2" id="pedidoCliente">-</p>
                                </div>
                                <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-semibold">-</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="text-sm font-semibold text-gray-600">Automóvel</label>
                                <p class="text-lg text-gray-900" id="pedidoAutomovel">-</p>
                            </div>
                            <div>
                                <label class="text-sm font-semibold text-gray-600">Data de Aluguel</label>
                                <p class="text-lg text-gray-900" id="pedidoData">-</p>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label class="text-sm font-semibold text-gray-600">Assinado</label>
                            <p class="text-lg text-gray-900" id="pedidoAssinado">-</p>
                        </div>
                        <div id="actionButtons" class="flex gap-3">
                            <a href="/pedidos-aluguel" class="btn btn-outline">Voltar</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="modalTemplate" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b"><h2 id="modalTitle" class="text-lg font-semibold text-gray-800"></h2></div>
            <div id="modalBody" class="px-6 py-4"></div>
            <div class="px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</button>
                <button id="modalConfirm" onclick="confirmModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Confirmar</button>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        let pedidoId = null;
        const clientesMap = {};
        const automovelMap = {};
        
        async function loadMaps() {
            try {
                const clientes = await fetchClientes(1, 1000);
                if (clientes) clientes.forEach(c => { clientesMap[c.id] = c.nome; });
                const autos = await fetchAutomoveis(1, 1000);
                if (autos) autos.forEach(a => { automovelMap[a.id] = `${a.marca} ${a.modelo}`; });
            } catch (error) { console.error('Error:', error); }
        }
        
        async function loadPedido() {
            try {
                const pathParts = window.location.pathname.split('/');
                pedidoId = pathParts[2];
                
                await loadMaps();
                
                const pedido = await fetchPedidoAluguelById(pedidoId);
                
                document.getElementById('pedidoId').textContent = pedido.id;
                document.getElementById('pedidoCliente').textContent = clientesMap[pedido.clienteId] || 'Cliente desconhecido';
                document.getElementById('pedidoAutomovel').textContent = automovelMap[pedido.automovelId] || 'Automóvel desconhecido';
                document.getElementById('pedidoData').textContent = formatDate(pedido.dataLocal);
                document.getElementById('pedidoAssinado').textContent = pedido.assinado ? '✓ Assinado' : '✗ Não assinado';
                
                const statusBadgeClass = pedido.status === 'PENDENTE' ? 'bg-yellow-100 text-yellow-800' :
                                      pedido.status === 'APROVADO' ? 'bg-green-100 text-green-800' :
                                      pedido.status === 'REJEITADO' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800';
                const statusBadge = document.getElementById('statusBadge');
                statusBadge.className = `px-3 py-1 rounded-full text-xs font-semibold ${statusBadgeClass}`;
                statusBadge.textContent = pedido.status;
                
                const actionButtons = document.getElementById('actionButtons');
                actionButtons.innerHTML = '';
                
                if (pedido.status === 'PENDENTE') {
                    const approveBtn = document.createElement('button');
                    approveBtn.className = 'btn bg-green-600 text-white hover:bg-green-700';
                    approveBtn.innerHTML = '<i data-feather="check" class="w-4 h-4 inline mr-2"></i>Aprovar';
                    approveBtn.onclick = () => approvePedido(pedidoId);
                    actionButtons.appendChild(approveBtn);
                    
                    const rejectBtn = document.createElement('button');
                    rejectBtn.className = 'btn bg-red-600 text-white hover:bg-red-700';
                    rejectBtn.innerHTML = '<i data-feather="x" class="w-4 h-4 inline mr-2"></i>Rejeitar';
                    rejectBtn.onclick = () => rejectPedido(pedidoId);
                    actionButtons.appendChild(rejectBtn);
                }
                
                if (pedido.status === 'APROVADO' && !pedido.assinado) {
                    const signBtn = document.createElement('button');
                    signBtn.className = 'btn bg-blue-600 text-white hover:bg-blue-700';
                    signBtn.innerHTML = '<i data-feather="edit" class="w-4 h-4 inline mr-2"></i>Assinar';
                    signBtn.onclick = () => signPedido(pedidoId);
                    actionButtons.appendChild(signBtn);
                }
                
                if (pedido.status === 'PENDENTE' || pedido.status === 'APROVADO') {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'btn bg-gray-600 text-white hover:bg-gray-700';
                    cancelBtn.innerHTML = '<i data-feather="ban" class="w-4 h-4 inline mr-2"></i>Cancelar';
                    cancelBtn.onclick = () => cancelPedido(pedidoId);
                    actionButtons.appendChild(cancelBtn);
                }
                
                const backBtn = document.createElement('a');
                backBtn.href = '/pedidos-aluguel';
                backBtn.className = 'btn btn-outline';
                backBtn.innerHTML = '<i data-feather="arrow-left" class="w-4 h-4 inline mr-2"></i>Voltar';
                actionButtons.appendChild(backBtn);
                
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar pedido');
            }
        }
        
        function approvePedido(id) {
            openModal('Aprovar Pedido', 'Tem certeza que deseja aprovar este pedido?', async () => {
                try { await approvePedidoAluguel(id); setTimeout(() => location.reload(), 1000); } catch (error) { console.error('Error:', error); }
            });
        }
        
        function rejectPedido(id) {
            openModal('Rejeitar Pedido', 'Tem certeza que deseja rejeitar este pedido?', async () => {
                try { await rejectPedidoAluguel(id); setTimeout(() => location.reload(), 1000); } catch (error) { console.error('Error:', error); }
            });
        }
        
        function signPedido(id) {
            openModal('Assinar Pedido', 'Tem certeza que deseja assinar este pedido?', async () => {
                try { await signContrato(id); setTimeout(() => location.reload(), 1000); } catch (error) { console.error('Error:', error); }
            });
        }
        
        function cancelPedido(id) {
            openModal('Cancelar Pedido', 'Tem certeza que deseja cancelar este pedido?', async () => {
                try { await cancelPedidoAluguel(id); setTimeout(() => location.reload(), 1000); } catch (error) { console.error('Error:', error); }
            });
        }
        
        document.addEventListener('DOMContentLoaded', loadPedido);
    </script>
</body>
</html>
