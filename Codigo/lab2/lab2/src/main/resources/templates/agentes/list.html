<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentes - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Agentes</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8">
                    <div id="messagesContainer"></div>
                    <div class="mb-8 flex justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-900">Agentes</h2>
                            <p class="text-gray-600 mt-1">Gerencie todos os agentes de aluguel</p>
                        </div>
                        <a href="/agentes/new" class="btn btn-primary">
                            <i data-feather="plus" class="w-4 h-4 inline mr-2"></i>
                            Novo Agente
                        </a>
                    </div>
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Nome</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Login</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">CNPJ</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Tipo</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="agentesTableBody" class="divide-y">
                                <tr><td colspan="6" class="px-6 py-4 text-center"><i data-feather="loader" class="w-6 h-6 inline animate-spin"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        async function loadAgentes() {
            try {
                const agentes = await fetchAgentes(1, 100);
                if (agentes && agentes.length > 0) {
                    let html = '';
                    for (const agente of agentes) {
                        const tipo = agente.class ? agente.class.split('.').pop() : 'Agente';
                        html += `<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-900">${agente.id}</td>
                            <td class="px-6 py-4 text-sm text-gray-900"><a href="/agentes/${agente.id}" class="text-blue-600 hover:text-blue-800">${agente.nome}</a></td>
                            <td class="px-6 py-4 text-sm text-gray-900">${agente.login}</td>
                            <td class="px-6 py-4 text-sm text-gray-900">${formatCNPJ(agente.cnpj)}</td>
                            <td class="px-6 py-4 text-sm"><span class="px-2 py-1 bg-purple-100 text-purple-800 rounded text-xs">${tipo}</span></td>
                            <td class="px-6 py-4 text-right text-sm">
                                <a href="/agentes/${agente.id}/edit" class="text-blue-600 hover:text-blue-800 mr-3"><i data-feather="edit" class="w-4 h-4 inline"></i></a>
                                <button type="button" onclick="confirmDeleteAgente(${agente.id})" class="text-red-600 hover:text-red-800"><i data-feather="trash-2" class="w-4 h-4 inline"></i></button>
                            </td>
                        </tr>`;
                    }
                    document.getElementById('agentesTableBody').innerHTML = html;
                } else {
                    document.getElementById('agentesTableBody').innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Nenhum agente encontrado</td></tr>`;
                }
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar agentes');
            }
        }
        function confirmDeleteAgente(agenteId) {
            confirmDelete(agenteId, 'agente', async () => {
                try { await deleteAgente(agenteId); loadAgentes(); } catch (error) { console.error('Error:', error); }
            });
        }
        document.addEventListener('DOMContentLoaded', loadAgentes);
    </script>
</body>
</html>
