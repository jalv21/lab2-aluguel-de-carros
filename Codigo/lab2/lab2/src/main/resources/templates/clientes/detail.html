<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Cliente</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8 max-w-2xl">
                    <div id="messagesContainer"></div>
                    <a href="/clientes" class="text-blue-600 hover:text-blue-800 text-sm mb-4 inline-block">
                        <i data-feather="arrow-left" class="w-4 h-4 inline mr-1"></i>
                        Voltar para Clientes
                    </a>
                    <div class="bg-white rounded-lg shadow p-8">
                        <div class="mb-6">
                            <h2 class="text-3xl font-bold text-gray-900" id="clienteName">Cliente</h2>
                            <p class="text-gray-500 mt-2" id="clienteLogin">login</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="text-sm font-semibold text-gray-600">CPF</label>
                                <p class="text-lg text-gray-900" id="clienteCPF">-</p>
                            </div>
                            <div>
                                <label class="text-sm font-semibold text-gray-600">RG</label>
                                <p class="text-lg text-gray-900" id="clienteRG">-</p>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label class="text-sm font-semibold text-gray-600">Profissão</label>
                            <p class="text-lg text-gray-900" id="clienteProfissao">-</p>
                        </div>
                        <div class="mb-6">
                            <label class="text-sm font-semibold text-gray-600">Endereço</label>
                            <p class="text-lg text-gray-900" id="clienteEndereco">-</p>
                        </div>
                        <div class="flex gap-3">
                            <a id="editBtn" href="#" class="btn btn-primary">
                                <i data-feather="edit" class="w-4 h-4 inline mr-2"></i>
                                Editar
                            </a>
                            <a href="/clientes" class="btn btn-outline">Voltar</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        async function loadCliente() {
            try {
                const pathParts = window.location.pathname.split('/');
                const clienteId = pathParts[2];
                const cliente = await fetchClienteById(clienteId);
                
                document.getElementById('clienteName').textContent = cliente.nome;
                document.getElementById('clienteLogin').textContent = `@${cliente.login}`;
                document.getElementById('clienteCPF').textContent = formatCPF(cliente.cpf);
                document.getElementById('clienteRG').textContent = cliente.rg;
                document.getElementById('clienteProfissao').textContent = cliente.profissao;
                document.getElementById('clienteEndereco').textContent = cliente.endereco;
                document.getElementById('editBtn').href = `/clientes/${clienteId}/edit`;
                
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar cliente');
            }
        }
        document.addEventListener('DOMContentLoaded', loadCliente);
    </script>
</body>
</html>
