<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Contratos</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8">
                    <div id="messagesContainer"></div>
                    <div class="mb-8 flex justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-900">Gerenciamento de Contratos</h2>
                            <p class="text-gray-600 mt-1">Gerencie todos os contratos</p>
                        </div>
                        <a href="/contratos/new" class="btn btn-primary">
                            <i data-feather="plus" class="w-4 h-4 inline mr-2"></i>
                            Novo Contrato
                        </a>
                    </div>
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Número</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Tipo</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Assinado</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="contratosTableBody" class="divide-y">
                                <tr><td colspan="5" class="px-6 py-4 text-center"><i data-feather="loader" class="w-6 h-6 inline animate-spin"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="modalTemplate" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b"><h2 id="modalTitle" class="text-lg font-semibold text-gray-800"></h2></div>
            <div id="modalBody" class="px-6 py-4"></div>
            <div class="px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</button>
                <button id="modalConfirm" onclick="confirmModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Confirmar</button>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/pagination.js}"></script>
    <script th:src="@{/js/filters.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        async function loadContratos() {
            try {
                const contratos = await fetchContratos(1, 100);
                if (contratos && contratos.length > 0) {
                    let html = '';
                    for (const contrato of contratos) {
                        html += `<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-900">${contrato.id}</td>
                            <td class="px-6 py-4 text-sm text-gray-900"><a href="/contratos/${contrato.id}" class="text-blue-600 hover:text-blue-800">${contrato.numero}</a></td>
                            <td class="px-6 py-4 text-sm text-gray-900"><span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs">${contrato.tipoContrato}</span></td>
                            <td class="px-6 py-4 text-sm">${contrato.assinado ? '<i data-feather="check-circle" class="w-4 h-4 text-green-600 inline"></i> Sim' : '<i data-feather="x-circle" class="w-4 h-4 text-gray-400 inline"></i> Não'}</td>
                            <td class="px-6 py-4 text-right text-sm">
                                <a href="/contratos/${contrato.id}/edit" class="text-blue-600 hover:text-blue-800 mr-3"><i data-feather="edit" class="w-4 h-4 inline"></i></a>
                                <button type="button" onclick="confirmDeleteContrato(${contrato.id})" class="text-red-600 hover:text-red-800"><i data-feather="trash-2" class="w-4 h-4 inline"></i></button>
                            </td>
                        </tr>`;
                    }
                    document.getElementById('contratosTableBody').innerHTML = html;
                } else {
                    document.getElementById('contratosTableBody').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500"><i data-feather="inbox" class="w-12 h-12 mx-auto mb-4 text-gray-400"></i><p>Nenhum contrato encontrado</p></td></tr>`;
                }
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar contratos');
            }
        }
        function confirmDeleteContrato(contratoId) {
            confirmDelete(contratoId, 'contrato', async () => {
                try { await deleteContrato(contratoId); loadContratos(); } catch (error) { console.error('Error:', error); }
            });
        }
        document.addEventListener('DOMContentLoaded', loadContratos);
    </script>
</body>
</html>
