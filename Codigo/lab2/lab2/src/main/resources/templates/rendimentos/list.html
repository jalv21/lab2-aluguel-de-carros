<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendimentos - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Rendimentos</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8">
                    <div id="messagesContainer"></div>
                    <div class="mb-8 flex justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-900">Rendimentos</h2>
                            <p class="text-gray-600 mt-1">Gerencie rendimentos de aluguéis</p>
                        </div>
                        <a href="/rendimentos/new" class="btn btn-primary">
                            <i data-feather="plus" class="w-4 h-4 inline mr-2"></i>
                            Novo Rendimento
                        </a>
                    </div>
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Entidade Empregadora</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase">Valor</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="rendimentosTableBody" class="divide-y">
                                <tr><td colspan="4" class="px-6 py-4 text-center"><i data-feather="loader" class="w-6 h-6 inline animate-spin"></i></td></tr>
                            </tbody>
                            <tfoot class="bg-gray-50 border-t">
                                <tr>
                                    <td colspan="2" class="px-6 py-4 font-semibold text-gray-900">Total</td>
                                    <td class="px-6 py-4 text-right font-semibold text-gray-900" id="totalRendimentos">R$ 0,00</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        async function loadRendimentos() {
            try {
                const rendimentos = await fetchRendimentos(1, 100);
                let total = 0;
                if (rendimentos && rendimentos.length > 0) {
                    let html = '';
                    for (const rend of rendimentos) {
                        total += rend.valor || 0;
                        html += `<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-900">${rend.id}</td>
                            <td class="px-6 py-4 text-sm text-gray-900">${rend.entidadeEmpregadora}</td>
                            <td class="px-6 py-4 text-sm text-right text-gray-900">${formatCurrency(rend.valor)}</td>
                            <td class="px-6 py-4 text-right text-sm">
                                <button type="button" onclick="confirmDeleteRendimento(${rend.id})" class="text-red-600 hover:text-red-800"><i data-feather="trash-2" class="w-4 h-4 inline"></i></button>
                            </td>
                        </tr>`;
                    }
                    document.getElementById('rendimentosTableBody').innerHTML = html;
                    document.getElementById('totalRendimentos').textContent = formatCurrency(total);
                } else {
                    document.getElementById('rendimentosTableBody').innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Nenhum rendimento encontrado</td></tr>`;
                }
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar rendimentos');
            }
        }
        function confirmDeleteRendimento(rendId) {
            confirmDelete(rendId, 'rendimento', async () => {
                try { await deleteRendimento(rendId); loadRendimentos(); } catch (error) { console.error('Error:', error); }
            });
        }
        document.addEventListener('DOMContentLoaded', loadRendimentos);
    </script>
</body>
</html>
