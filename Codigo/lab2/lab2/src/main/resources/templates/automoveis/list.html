<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automóveis - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Automóveis</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8">
                    <div id="messagesContainer"></div>
                    <div class="mb-8 flex justify-between items-center">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-900">Frota de Automóveis</h2>
                            <p class="text-gray-600 mt-1">Gerencie todos os veículos disponíveis</p>
                        </div>
                        <a href="/automoveis/new" class="btn btn-primary">
                            <i data-feather="plus" class="w-4 h-4 inline mr-2"></i>
                            Novo Automóvel
                        </a>
                    </div>
                    <div class="bg-white rounded-lg shadow mb-6 p-4">
                        <div id="searchContainer"></div>
                    </div>
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="w-full" id="automovelTable">
                            <thead class="bg-gray-50 border-b">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Marca</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Modelo</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Placa</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Ano</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="automovelTableBody" class="divide-y">
                                <tr><td colspan="6" class="px-6 py-4 text-center"><i data-feather="loader" class="w-6 h-6 inline animate-spin"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="modalTemplate" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b"><h2 id="modalTitle" class="text-lg font-semibold text-gray-800"></h2></div>
            <div id="modalBody" class="px-6 py-4"></div>
            <div class="px-6 py-4 border-t flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</button>
                <button id="modalConfirm" onclick="confirmModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Confirmar</button>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/pagination.js}"></script>
    <script th:src="@{/js/filters.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        const PAGE_SIZE = 15;
        async function loadAutomoveis() {
            try {
                const page = getQueryParam('page') || 1;
                const search = getQueryParam('search') || '';
                const automoveis = await fetchAutomoveis(page, PAGE_SIZE, search);
                document.getElementById('searchContainer').innerHTML = createSearchBox('Buscar por marca, modelo ou placa...', 'applySearch');
                if (automoveis && automoveis.length > 0) {
                    let html = '';
                    for (const auto of automoveis) {
                        html += `<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 text-sm text-gray-900">${auto.id}</td>
                            <td class="px-6 py-4 text-sm text-gray-900"><a href="/automoveis/${auto.id}" class="text-blue-600 hover:text-blue-800">${auto.marca}</a></td>
                            <td class="px-6 py-4 text-sm text-gray-900">${auto.modelo}</td>
                            <td class="px-6 py-4 text-sm text-gray-900">${auto.placa}</td>
                            <td class="px-6 py-4 text-sm text-gray-900">${auto.ano}</td>
                            <td class="px-6 py-4 text-right text-sm">
                                <a href="/automoveis/${auto.id}/edit" class="text-blue-600 hover:text-blue-800 mr-3"><i data-feather="edit" class="w-4 h-4 inline"></i></a>
                                <button type="button" onclick="confirmDeleteAutomovel(${auto.id})" class="text-red-600 hover:text-red-800"><i data-feather="trash-2" class="w-4 h-4 inline"></i></button>
                            </td>
                        </tr>`;
                    }
                    document.getElementById('automovelTableBody').innerHTML = html;
                } else {
                    document.getElementById('automovelTableBody').innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500"><i data-feather="inbox" class="w-12 h-12 mx-auto mb-4 text-gray-400"></i><p>Nenhum automóvel encontrado</p></td></tr>`;
                }
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar automóveis');
            }
        }
        function applySearch(query) {
            const params = new URLSearchParams();
            if (query) params.set('search', query);
            params.set('page', 1);
            window.location.search = params.toString();
        }
        function confirmDeleteAutomovel(autoId) {
            confirmDelete(autoId, 'automóvel', async () => {
                try { await deleteAutomovel(autoId); loadAutomoveis(); } catch (error) { console.error('Error:', error); }
            });
        }
        document.addEventListener('DOMContentLoaded', loadAutomoveis);
    </script>
</body>
</html>
