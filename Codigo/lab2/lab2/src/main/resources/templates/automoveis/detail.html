<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automóvel - Aluguel de Carros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen bg-gray-100">
        <div th:replace="layout/sidebar :: sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow">
                <div class="px-6 py-4 flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-gray-800">Automóvel</h1>
                    <button onclick="logout()" class="text-gray-500 hover:text-gray-700">
                        <i data-feather="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto">
                <div class="container mx-auto px-6 py-8 max-w-2xl">
                    <div id="messagesContainer"></div>
                    <a href="/automoveis" class="text-blue-600 hover:text-blue-800 text-sm mb-4 inline-block">
                        <i data-feather="arrow-left" class="w-4 h-4 inline mr-1"></i>
                        Voltar para Automóveis
                    </a>
                    <div class="bg-white rounded-lg shadow p-8">
                        <div class="mb-6">
                            <h2 class="text-3xl font-bold text-gray-900" id="autoMarcaModelo">Automóvel</h2>
                            <p class="text-gray-500 mt-2" id="autoPlaca">-</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="text-sm font-semibold text-gray-600">Marca</label>
                                <p class="text-lg text-gray-900" id="autoMarca">-</p>
                            </div>
                            <div>
                                <label class="text-sm font-semibold text-gray-600">Modelo</label>
                                <p class="text-lg text-gray-900" id="autoModelo">-</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                            <div>
                                <label class="text-sm font-semibold text-gray-600">Ano</label>
                                <p class="text-lg text-gray-900" id="autoAno">-</p>
                            </div>
                            <div>
                                <label class="text-sm font-semibold text-gray-600">Matrícula</label>
                                <p class="text-lg text-gray-900" id="autoMatricula">-</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <a id="editBtn" href="#" class="btn btn-primary">
                                <i data-feather="edit" class="w-4 h-4 inline mr-2"></i>
                                Editar
                            </a>
                            <a href="/automoveis" class="btn btn-outline">Voltar</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="toastContainer" class="fixed top-4 right-4 z-40 space-y-2"></div>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script th:src="@{/js/api.js}"></script>
    <script th:src="@{/js/main.js}"></script>
    <script>
        async function loadAutomovel() {
            try {
                const pathParts = window.location.pathname.split('/');
                const autoId = pathParts[2];
                const auto = await fetchAutomovelById(autoId);
                
                document.getElementById('autoMarcaModelo').textContent = `${auto.marca} ${auto.modelo}`;
                document.getElementById('autoPlaca').textContent = auto.placa;
                document.getElementById('autoMarca').textContent = auto.marca;
                document.getElementById('autoModelo').textContent = auto.modelo;
                document.getElementById('autoAno').textContent = auto.ano;
                document.getElementById('autoMatricula').textContent = auto.matricula;
                document.getElementById('editBtn').href = `/automoveis/${autoId}/edit`;
                
                feather.replace();
            } catch (error) {
                console.error('Error:', error);
                showError('Erro ao carregar automóvel');
            }
        }
        document.addEventListener('DOMContentLoaded', loadAutomovel);
    </script>
</body>
</html>
